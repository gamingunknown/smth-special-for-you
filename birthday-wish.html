<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, My Love ♡</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/birthday-wish.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="romantic-bg"></div>
  <div class="bg-glow-orb bg-glow-orb-1"></div>

  <main class="wish-wrapper">
    <!-- Interactive 3D Envelope -->
    <div class="envelope-container" id="envelopeContainer">
      <div class="envelope" id="envelope" role="button" aria-label="Open birthday envelope">
        <div class="envelope-flap" id="envelopeFlap"></div>
        <div class="envelope-pocket"></div>
        <div class="heart-seal" id="heartSeal">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFB6D5" aria-hidden="true">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>
      <p class="envelope-prompt" id="envelopePrompt">Click the envelope to open! ♡</p>
    </div>

    <!-- Birthday Card Revealed from Envelope -->
    <div class="glass-card birthday-card" id="birthdayCard">
      <h2 class="card-title">Happy Birthday Kiyo!</h2>

      <div class="photo-frame">
        <img src="assets/images/bday_img.jpg" alt="Birthday Special">
      </div>

      <p class="card-text">
        Wish You Many More Happie Returns of the Day My Dumbo — 
        You mean so much to mee! Wishing my dumbass a day filled with Happiness, Laughter!
        I'm soo grateful to have you in mah life! You da GOAT!! 💖
      </p>

      <button id="nextBtn" class="romantic-btn">
        Lets move on to the next level ♡
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/birthday-wish.js"></script>
</body>
</html>
