<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Bhondu! ♡</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/entrance.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="romantic-bg"></div>
  <div class="bg-glow-orb bg-glow-orb-1"></div>
  <div class="bg-glow-orb bg-glow-orb-2"></div>

  <main class="entrance-wrapper">
    <div class="glass-card entrance-card" id="entranceCard">
      <!-- Glowing Central Heart Orb with Pulse Ring -->
      <div class="glowing-orb-container">
        <div class="pulse-ring"></div>
        <div class="glowing-orb">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="#FFB6D5">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>

      <h1 class="entrance-title">For My Bhondu! ♡</h1>
      <p class="entrance-subtitle">I made a lil smth.</p>

      <div id="hiddenMessage" class="hidden-message" aria-live="polite">
        Let's start your birthday story... ✨
      </div>

      <div class="button-wrapper">
        <button id="enterBtn" class="romantic-btn">
          Enter!!! ♡
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/entrance.js"></script>
</body>
</html>
